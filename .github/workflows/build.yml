name: Build and Scan

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Python (for old node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install node
        uses: actions/setup-node@v5
        with:
          node-version: 14.x

      - name: Install dependencies
        run: npm ci