name: Build and Scan

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04   # or ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 14.x

      - name: Install dependencies
        run: npm ci
